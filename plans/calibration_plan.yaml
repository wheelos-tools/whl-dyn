- case_name: throttle_20_to_3mps
  description: Accelerate with 20% throttle, target >3.0m/s, then brake to stop.
  domain: longitudinal_calibration
  actuator: throttle
  gear_location: 1
  sampling_rate_hz: 50.0
  input_signals:
  - ctl_throttle
  - ctl_brake
  - ctl_gear
  output_signals:
  - speed_mps
  - ins_speed_mps
  - imu_accel_y
  - actual_gear
  - throttle_pct
  - brake_pct
  steps:
  - command:
      throttle: 20.0
      brake: 0.0
    trigger:
      type: speed_greater_than
      value: 3.0
    timeout_sec: 30.0
    hold_duration_ms: 500
  - command:
      throttle: 0.0
      brake: 30.0
    trigger:
      type: speed_less_than
      value: 0.1
    timeout_sec: 30.0
